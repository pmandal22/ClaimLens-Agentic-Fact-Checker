[project]
name = "claimlens"
version = "0.1.0"
description = "Agentic fact checker for short-form video reels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "google-cloud-storage>=2.18",
    "httpx>=0.27",
    # The API resumes runs paused for review and the worker runs them, so both need these.
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "redis>=5.0",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2025.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
# Speech-to-text only (no PyTorch); the worker image installs this group.
asr = [
    "faster-whisper>=1.0",
    # faster-whisper 1.x calls av.open(metadata_errors=...), removed in newer PyAV.
    "av<17",
]
# Claim extraction (OpenAI via LangChain); the worker image installs this group.
llm = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=0.3",
]
# Heavy ML/LLM packages. Docker images for the API and worker skip this group until needed.
pipeline = [
    "easyocr>=1.7",
    "faster-whisper>=1.0",
    "google-cloud-vision>=3.7",
    "langchain>=1.0",
    "langchain-anthropic>=0.3",
    "langchain-core>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.3",
    "langsmith>=0.1",
    "scenedetect[opencv]>=0.6",
    "tavily-python>=0.5",
]
ui = [
    "streamlit>=1.38",
]

[tool.uv]
# Plain `uv sync` / `uv run` on your machine installs everything, as before.
default-groups = ["dev", "pipeline", "ui"]
